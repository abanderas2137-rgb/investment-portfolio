name: .NET Framework 4.7.1 CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Klonowanie kodu
      uses: actions/checkout@v4

    - name: Konfiguracja MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Przywracanie zależności
      run: dotnet restore InvestmentPortfolio.sln

    - name: Budowanie rozwiązania (Release)
      run: msbuild InvestmentPortfolio.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    # Obecnie repozytorium nie zawiera projektu testowego.
    # Po jego dodaniu można tutaj dodać krok dotnet test.
