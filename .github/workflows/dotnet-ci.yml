name: .NET Framework 4.7.1 CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Klonowanie kodu
      uses: actions/checkout@v4

    - name: Konfiguracja MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Przywracanie zależności
      run: dotnet restore InvestmentPortfolio.csproj

    - name: Budowanie projektu (Release)
      run: msbuild InvestmentPortfolio.csproj /p:Configuration=Release /p:Platform="Any CPU" /m

    # Repozytorium nie zawiera jeszcze projektu testowego.
    # Gdy zostaną dodane testy, można dodać osobny krok dotnet test.
